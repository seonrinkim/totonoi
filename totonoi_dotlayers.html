/* ---------- 장면 ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(CONFIG.background, 1);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07; controls.autoRotateSpeed = 0.6;

/* 모든 장을 같은 세로 칸 수(rows)로 다시 뽑기 — 가로는 원본 비율대로, 가장 가까운 칸을 가져오는 방식 */
function resample(g, h) {
  const w = Math.round(g.w * h / g.h);
  let idx = '';
  for (let j = 0; j < h; j++) {
    const sj = Math.min(g.h - 1, Math.floor((j + 0.5) * g.h / h));
    for (let i = 0; i < w; i++) idx += g.idx[sj * g.w + Math.min(g.w - 1, Math.floor((i + 0.5) * g.w / w))];
  }
  return { w, h, idx };
}

/* 점마다 다른 비정형 물방울 모양 — 점마다 무작위 값 4개(shape)로 회전·길쭉함·굴곡을 정함. 색은 단색 그대로 */
function dropletShader(sh) {
  sh.uniforms.wobble = { value: CONFIG.wobble };
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nattribute vec4 shape;\nvarying vec4 vShape;')
    .replace('#include <color_vertex>', '#include <color_vertex>\nvShape = shape;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\nvarying vec4 vShape;\nuniform float wobble;')
    .replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
      vec2 p = gl_PointCoord * 2.0 - 1.0;
      float t = vShape.x * 6.2832;
      p = mat2(cos(t), -sin(t), sin(t), cos(t)) * p;
      float e = 0.82 + 0.36 * vShape.y;          // 길쭉함
      p.x /= e; p.y *= e;
      float a = atan(p.y, p.x), r = length(p);
      float R = 0.6 + wobble * (
          0.09 * sin(2.0*a + vShape.z*6.2832)
        + 0.06 * sin(3.0*a + vShape.w*6.2832)
        + 0.10 * pow(max(0.0, cos(a - vShape.w*6.2832)), 6.0));  // 한쪽으로 살짝 맺히는 꼬리
      if (r > R * 0.8) discard;`);
}

/* 한 장의 점 좌표와 색 — rows 가 클수록 점 간격이 촘촘해짐 (점 크기는 그대로) */
function dotsOf(r, rows) {
  const g = resample(GRIDS[r], rows), cell = CONFIG.layerHeight / g.h;
  const pos = [], col = [], c = new THREE.Color();
  const push = (x, y, z, hex) => { pos.push(x, y, z); c.set(hex); col.push(c.r, c.g, c.b); };
  for (let j = 0; j < g.h; j++) for (let i = 0; i < g.w; i++) {
    const id = +g.idx[j*g.w + i];
    if (id === 5) continue;
    const x = (i - g.w/2) * cell, y = (g.h/2 - j) * cell;
    if (id === 6) {
      const o = CONFIG.overlapOffset;
      push(x - o, y + o, -o, CONFIG.overlap[0]);
      push(x + o, y - o,  o, CONFIG.overlap[1]);
    } else push(x, y, 0, CONFIG.palette[id]);
  }
  return { pos, col, n: pos.length / 3 };
}

function geometryOf(pos, col) {
  const geo = new THREE.BufferGeometry(), n = pos.length / 3;
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setAttribute('shape', new THREE.BufferAttribute(Float32Array.from({ length: n * 4 }, Math.random), 4));
  return geo;
}

const buildGeometry = (r, rows) => { const d = dotsOf(r, rows); return geometryOf(d.pos, d.col); };

const dotSize = CONFIG.layerHeight / CONFIG.rows * CONFIG.pointScale;
function dotMaterial() {
  const mat = new THREE.PointsMaterial({ size: dotSize, vertexColors: true, sizeAttenuation: true,
                                         transparent: true, opacity: CONFIG.opacity, depthWrite: false });
  mat.onBeforeCompile = dropletShader;
  return mat;
}

const layers = [];
const tFirst = STARTS[0], tLast = STARTS[7];
for (let r = 1; r <= 8; r++) {
  const pts = new THREE.Points(buildGeometry(r, CONFIG.rows), dotMaterial());
  pts.userData.z = CONFIG.depth/2 - (STARTS[r-1] - tFirst) / (tLast - tFirst) * CONFIG.depth;  // 1R 이 맨 앞(카메라 쪽), 8R 이 맨 뒤
  pts.position.z = pts.userData.z;
  scene.add(pts); layers.push(pts);
}

/* 오른쪽 세로 슬라이더 — 세로 칸 수를 바꿔 점 간격을 촘촘~넓직하게 */
const density = document.getElementById('density');
density.min = CONFIG.rowsRange[0]; density.max = CONFIG.rowsRange[1]; density.value = CONFIG.rows;
let rebuildTimer = null;
density.addEventListener('input', () => {
  clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(() => {
    layers.forEach((l, i) => { l.geometry.dispose(); l.geometry = buildGeometry(i + 1, +density.value); });
    if (morph) { const cur = morph.cur; stopMorph(); startMorph(cur); }
  }, 30);
});

/* ---------- 시점 ---------- */
const VIEWS = {
  front:   new THREE.Vector3(0, 0, 26),
  oblique: new THREE.Vector3(16, 7, 21),
  side:    new THREE.Vector3(32, 0, 0),
  top:     new THREE.Vector3(0, 30, 0.01)
};
let tween = null;
function go(name, instant) {
  const to = VIEWS[name].clone().add(controls.target);
  if (instant) { camera.position.copy(to); return; }
  tween = { from: camera.position.clone(), to, t0: performance.now() };
}
document.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-v]').forEach(q => q.setAttribute('aria-pressed', String(q === b)));
  go(b.dataset.v);
}));
renderer.domElement.addEventListener('pointerdown', () => { tween = null; });

/* 한 장씩 보기 — 고른 장만 보이고, 시점의 중심이 그 장으로 옮겨감 (0 = 전부) */
let solo = 0, focusZ = 0;
const pressRound = l => document.querySelectorAll('[data-l]').forEach(q => q.setAttribute('aria-pressed', String(+q.dataset.l === l)));
const showLayers = () => layers.forEach((l, i) => { l.visible = !morph && (!solo || i === solo - 1); });
document.querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', () => {
  if (morph) setMorph(false);
  solo = +b.dataset.l;
  pressRound(solo); showLayers();
}));

/* ---------- 모핑 — 한 벌의 점이 자리를 옮겨 1R→2R→…→8R→1R 을 차례로 그림 ---------- */
let morph = null;
const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2;

/* 점 개수를 n 개로 맞춤 — 점이 모자란 장은 순서를 유지한 채 몇 자리를 겹쳐 씀 */
function fit(d, n) {
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  for (let k = 0; k < n; k++) {
    const s = Math.floor(k * d.n / n) * 3;
    for (let c = 0; c < 3; c++) { pos[k*3 + c] = d.pos[s + c]; col[k*3 + c] = d.col[s + c]; }
  }
  return { pos, col };
}

function startMorph(from) {
  const dots = layers.map((_, i) => dotsOf(i + 1, +density.value));
  const n = Math.max(...dots.map(d => d.n));
  const frames = dots.map(d => fit(d, n));
  const pts = new THREE.Points(geometryOf(frames[from].pos, frames[from].col), dotMaterial());
  scene.add(pts);
  morph = { pts, frames, cur: from, t0: performance.now(),
            delay: Float32Array.from({ length: n }, () => Math.random() * CONFIG.morphStagger),
            lift:  Float32Array.from({ length: n }, () => (Math.random() * 2 - 1) * CONFIG.morphLift) };
  pressRound(from + 1);
}

function stopMorph() {
  scene.remove(morph.pts); morph.pts.geometry.dispose(); morph.pts.material.dispose();
  morph = null;
}

function updateMorph(now) {
  const t = (now - morph.t0) / 1000 - CONFIG.morphHold;   // 머무는 시간이 지나면 움직이기 시작
  if (t < 0) return;
  const { pts, frames, delay, lift } = morph, next = (morph.cur + 1) % frames.length;
  const a = frames[morph.cur], b = frames[next];
  const P = pts.geometry.attributes.position, C = pts.geometry.attributes.color;
  for (let k = 0; k < delay.length; k++) {
    const u = Math.min(1, Math.max(0, (t - delay[k]) / CONFIG.morphMove)), e = ease(u);
    for (let c = 0; c < 3; c++) {
      const i = k*3 + c;
      P.array[i] = a.pos[i] + (b.pos[i] - a.pos[i]) * e;
      C.array[i] = a.col[i] + (b.col[i] - a.col[i]) * e;
    }
    P.array[k*3 + 2] += Math.sin(Math.PI * u) * lift[k];
  }
  P.needsUpdate = true; C.needsUpdate = true;
  if (t >= CONFIG.morphMove + CONFIG.morphStagger) { morph.cur = next; morph.t0 = now; pressRound(next + 1); }
}

const morphBtn = document.getElementById('morph');
function setMorph(on) {
  if (on) { const from = solo ? solo - 1 : 0; solo = 0; startMorph(from); }
  else { stopMorph(); pressRound(solo); }
  morphBtn.setAttribute('aria-pressed', String(on));
  showLayers();
}
morphBtn.addEventListener('click', () => setMorph(!morph));

let spread = 1, want = 1;
const sp = document.getElementById('spread');
sp.addEventListener('click', () => { want = want === 1 ? CONFIG.spreadFactor : 1; sp.setAttribute('aria-pressed', String(want !== 1)); });
const spin = document.getElementById('spin');
spin.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; spin.setAttribute('aria-pressed', String(controls.autoRotate)); });

/* 지금 보이는 각도를 고해상도 PNG 로 저장 */
document.getElementById('save').addEventListener('click', () => {
  const pr = renderer.getPixelRatio();
  renderer.setPixelRatio(3); resize(); renderer.render(scene, camera);
  renderer.domElement.toBlob(blob => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'strata-of-color.png'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    renderer.setPixelRatio(pr); resize();
  }, 'image/png');
});

/* 전체 화면 — Esc 로 나와도 버튼 상태가 따라감 */
const full = document.getElementById('full');
full.hidden = !document.fullscreenEnabled;   // 전체 화면을 지원하지 않는 브라우저(아이폰 등)에서는 숨김
full.addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});
/* 화면을 클릭해 전체 화면에서 나오면 손을 뗀 신호(pointerup)가 캔버스에 오지 않아 OrbitControls 가 계속 누른 상태로 남음 —
   전체 화면이 바뀔 때 아직 눌린 것으로 남은 포인터를 취소해 줌 */
const heldPointers = new Set();
renderer.domElement.addEventListener('pointerdown', e => heldPointers.add(e.pointerId));
addEventListener('pointerup', e => heldPointers.delete(e.pointerId));
document.addEventListener('fullscreenchange', () => {
  full.setAttribute('aria-pressed', String(!!document.fullscreenElement));
  heldPointers.forEach(pointerId => renderer.domElement.dispatchEvent(new PointerEvent('pointercancel', { pointerId })));
  heldPointers.clear();
});

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize(); go('oblique', true);

function loop(now) {
  if (tween) { const k = Math.min(1, (now - tween.t0) / 1000);
    camera.position.lerpVectors(tween.from, tween.to, ease(k)); if (k >= 1) tween = null; }
  if (morph) updateMorph(now);
  spread += (want - spread) * 0.08;
  layers.forEach(l => { l.position.z = l.userData.z * spread; });
  const dz = ((solo ? layers[solo-1].position.z : 0) - focusZ) * 0.08;
  focusZ += dz; controls.target.z += dz; camera.position.z += dz;
  if (tween) { tween.from.z += dz; tween.to.z += dz; }
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
